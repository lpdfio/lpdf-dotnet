name: Release
run-name: "Release ${{ github.event.client_payload.version || github.ref_name }} to NuGet (${{ github.event_name == 'repository_dispatch' && 'core' || 'adapter' }})"

on:
  repository_dispatch:
    types: [core-release]
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ── Resolve version ──────────────────────────────────────────────────────
      - name: Resolve version
        run: |
          ADAPTER_TAG="${{ github.event.client_payload.version || github.ref_name }}"
          CORE_TAG=$(echo "$ADAPTER_TAG" | sed 's/\.[0-9]*$/.0/')
          VERSION="${ADAPTER_TAG#v}"
          echo "ADAPTER_TAG=$ADAPTER_TAG"   >> "$GITHUB_ENV"
          echo "CORE_TAG=$CORE_TAG"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION"           >> "$GITHUB_ENV"

      # ── Download WASI binary from core release ───────────────────────────────
      - name: Download lpdf-wasi.wasm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p wasm
          DOWNLOADED=""
          for attempt in 1 2 3; do
            gh release download "$CORE_TAG" \
              --repo lpdfio/lpdf \
              --pattern "lpdf-wasi.wasm" \
              --dir wasm \
              --clobber && DOWNLOADED=1 && break
            echo "Attempt $attempt failed — retrying in 10s..."
            sleep 10
          done
          # No fallback to the latest core: vX.Y.Z must ship engine vX.Y.0
          # (var/VERSIONING.md in lpdfio/lpdf). ci.yml keeps its fallback.
          if [ -z "$DOWNLOADED" ]; then
            echo "::error::Could not download core $CORE_TAG. This release must ship engine $CORE_TAG — publish that core release first, or check the tag."
            exit 1
          fi
          mv wasm/lpdf-wasi.wasm wasm/lpdf.wasm   # csproj embeds as lpdf.wasm

      # ── Build and test ───────────────────────────────────────────────────────
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set version in csproj
        run: sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|" Lpdf.csproj

      - name: Restore
        run: dotnet restore Lpdf.sln

      - name: Build
        run: dotnet build Lpdf.sln -c Release --no-restore

      # ── Fetch test fixtures and snapshots from core ──────────────────────────
      # The fixture XML files and golden SHA-256 snapshots live in the core
      # monorepo (lpdfio/lpdf).  Sparse-clone only those two directories so
      # that snapshot tests can actually run in this adapter's CI.
      # Cloned at CORE_TAG, the engine this release ships, so the snapshots
      # match it even after core's main has moved on (e.g. between an RC and
      # the final release).
      - name: Fetch test fixtures and snapshots from core
        run: |
          git clone --depth 1 --branch "$CORE_TAG" --filter=blob:none --sparse \
            https://github.com/lpdfio/lpdf.git _core
          git -C _core sparse-checkout set test/fixtures test/snapshots
          mkdir -p test/fixtures test/snapshots
          cp -r _core/test/fixtures/. test/fixtures/
          cp -r _core/test/snapshots/. test/snapshots/
          rm -rf _core

      - name: Test
        run: dotnet test Lpdf.sln --no-build -c Release

      # ── Pack and publish ──────────────────────────────────────────────────────
      - name: Pack
        run: dotnet pack Lpdf.csproj -c Release --no-build -o nupkg

      - name: Publish to NuGet
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # ── Changelog ────────────────────────────────────────────────────────────
      # Writes this release's notes into CHANGELOG.md on main, and hands the
      # same text to the release step below so the file and the Releases page
      # can't disagree.
      #
      # Runs BEFORE the tag is created, so the tag contains its own entry.
      #
      # Fails the job on error, deliberately — this path is unproven. Relax to
      # warn-only once a core release has exercised it (changelog-plan.md,
      # "Rollout").
      - name: Update CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # Core cascade. Nobody types notes on this path — nobody can — so
            # copy core's verbatim. Core publishes its release before
            # dispatching, so the body is always readable by now.
            BODY=$(gh release view "$CORE_TAG" --repo lpdfio/lpdf --json body -q .body | tr -d '\r')
            HEADER="## $ADAPTER_TAG (core) — $(date -u +%F)"
          else
            # Adapter-only patch: the notes typed on this repo's own release.
            BODY=$(gh release view "$ADAPTER_TAG" --json body        -q .body        | tr -d '\r')
            DATE=$(gh release view "$ADAPTER_TAG" --json publishedAt -q .publishedAt | cut -c1-10)
            if [ -z "$DATE" ]; then
              echo "::error::$ADAPTER_TAG has no published release — was the tag pushed without one?"
              exit 1
            fi
            HEADER="## $ADAPTER_TAG — $DATE"
          fi

          # Hand the body to the release step below (multi-line safe).
          {
            echo 'RELEASE_BODY<<__LPDF_BODY__'
            printf '%s\n' "$BODY"
            echo '__LPDF_BODY__'
          } >> "$GITHUB_ENV"

          # Drop the in-job version bump — it is deliberately never committed,
          # and it would block the branch switch below.
          git checkout -- .

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

          if ! head -n 1 CHANGELOG.md | grep -qx '# Changelog'; then
            echo "::error::CHANGELOG.md must start with a '# Changelog' line"
            exit 1
          fi

          # Re-runs must not duplicate an entry.
          if grep -q "^## $ADAPTER_TAG " CHANGELOG.md; then
            echo "$ADAPTER_TAG is already in CHANGELOG.md — nothing to do"
            exit 0
          fi

          # Prepend only. Never reformat or reorder what is already there —
          # the file is hand-editable by design.
          {
            echo "# Changelog"
            echo
            echo "$HEADER"
            if [ -n "$BODY" ]; then printf '%s\n' "$BODY"; fi
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.next
          mv CHANGELOG.next CHANGELOG.md

          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "changelog: $ADAPTER_TAG"
          git push origin main

      # ── Create GitHub Release (core-triggered only) ──────────────────────────
      # --notes carries core's text onto this repo's Releases page, which
      # otherwise shows a bare "Full Changelog" compare link. --generate-notes
      # remains the fallback for an empty core body.
      - name: Create GitHub Release
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "$ADAPTER_TAG"
          git push origin "$ADAPTER_TAG"
          if [ -n "${RELEASE_BODY:-}" ]; then
            gh release create "$ADAPTER_TAG" \
              --title "$ADAPTER_TAG" \
              --notes "$RELEASE_BODY"
          else
            gh release create "$ADAPTER_TAG" \
              --title "$ADAPTER_TAG" \
              --generate-notes
          fi
